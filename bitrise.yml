  madeira-v016-window-refresh:
    title: Madeira 0.1.6 native window refresh and IPA
    description: Restore the verified native bundle and replace only win32u window.o from current Wine source.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          title: Refresh native window handling, check app and build IPA
