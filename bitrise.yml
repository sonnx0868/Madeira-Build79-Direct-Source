format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

# Manual builds while comparing queue times with Codemagic.
# Match the Xcode 27 stack offered by this workspace's trial.
meta:
  bitrise.io:
    stack: osx-xcode-27.0.x
    machine_type_id: g2.mac.large

app:
  envs:
    - XCODE_PROJECT: app/Madeira.xcodeproj
    - XCODE_SCHEME: Madeira
    - APP_CONFIGURATION: Debug
    - JOBS: '4'
    - MADEIRA_NATIVE_DEPS_URL: https://github.com/sonnx0868/Madeira-Build79-Direct-Source/releases/download/v0.1.6-build744-6bd3e3f/Madeira-v0.1.6-native-deps-build744.zip
    - MADEIRA_NATIVE_DEPS_SHA256: 66adf29c9f9ee238d1c05cb9417af300a60ea66cc7612b70e0ea90e92c2adf37

workflows:
  madeira-gpu-stage-check:
    title: Check original-device GPU stage sampling
    description: Compile public Metal stage hooks and exercise lifecycle/export gates without producing an IPA.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          title: Validate stage counters with Apple SDK and lifecycle tests
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                mkdir -p "$BITRISE_DEPLOY_DIR"
                exec > >(tee "$BITRISE_DEPLOY_DIR/gpu-stage-check.log") 2>&1
                git submodule update --init dxmt
                xcodebuild -version
                sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
                xcrun --sdk iphoneos clang -fobjc-arc -fmodules -fblocks -target arm64-apple-ios18.0 \
                  -isysroot "$sdk" -fsyntax-only app/Madeira/GPUTraceCapture.m
                python3 tests/host/check-gpu-stages.py --require-darwin
                python3 tests/host/check-gpu-trace.py --require-darwin
                python3 tests/host/check-gpu-trace-share.py
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            - is_compress: 'true'
            - zip_name: Madeira-GPU-stage-check
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

  madeira-gpu-analysis:
    title: Inspect Apple GPU capture analysis tools
    description: Locate GPU debugger and replayer tools on the Mac analysis runner, without producing an IPA.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
