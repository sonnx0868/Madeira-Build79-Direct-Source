  madeira-v016-ui-preview:
    title: Madeira production SwiftUI screenshots
    description: Render the current library and PIN views on iPad Simulator with fixture data.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
