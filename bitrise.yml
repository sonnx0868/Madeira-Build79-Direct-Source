format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

# Manual builds while comparing queue times with Codemagic.
# Match the Xcode 27 stack offered by this workspace's trial.
meta:
  bitrise.io:
    stack: osx-xcode-27.0.x
    machine_type_id: g2.mac.large

app:
  envs:
    - XCODE_PROJECT: app/Madeira.xcodeproj
    - XCODE_SCHEME: Madeira
    - APP_CONFIGURATION: Debug
    - JOBS: '4'
    - MADEIRA_NATIVE_DEPS_URL: https://github.com/sonnx0868/Madeira-Build79-Direct-Source/releases/download/v0.1.6-build875-82d08f2/Madeira-v0.1.6-native-deps-build875.zip
    - MADEIRA_NATIVE_DEPS_SHA256: 41c4a98894a82c767bb69194bd6d5ba8882facbaec7d74b85b5d8357bf50453c

workflows:
  madeira-chrome-windows-check:
    title: Validate Windows Chrome launch policy and build an experimental IPA
    description: Verify the production browser policy on Mac/iOS, rebuild native completely and package every bound payload; no publication or device compatibility claim.
    triggers:
      push:
        - branch: codex/chrome-windows
    steps:
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          title: Check Chrome package, profile isolation, arguments and iOS compilation
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                mkdir -p build/chrome-check
                diagnose_exit() {
                  status=$?
                  if (( status != 0 )); then python3 tests/host/report-full-native-source.py || true; fi
                  exit "$status"
                }
                trap diagnose_exit EXIT
                curl --fail --location --retry 3 https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/win64/chrome-win64.zip --output build/chrome-check/chrome.zip
                echo 'a4e0d57245e167e98a9d465af1e3774d2b4ec9f04e483d19bcd97a6f63cf46dd  build/chrome-check/chrome.zip' | shasum -a 256 -c -
                unzip -q build/chrome-check/chrome.zip -d build/chrome-check
                python3 tests/host/check-windows-browser.py --require-swift --chrome build/chrome-check/chrome-win64/chrome.exe
                if ! command -v 7zz >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install sevenzip; fi
                curl --fail --location --retry 3 https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise.msi --output build/chrome-check/google-chrome-stable32.msi
                python3 tools/extract-google-chrome.py --archive build/chrome-check/google-chrome-stable32.msi --sha256 05e3a2285039f22e68d999f5943c1cbb9b0c953fc307de925be57876d51cf506 --out build/chrome-check/regular32
                python3 tests/host/check-windows-browser.py --require-swift --chrome build/chrome-check/regular32/program/Chrome-bin/chrome.exe
                python3 tests/host/check-guest-image-eager-protection.py --chrome-dll build/chrome-check/regular32/program/Chrome-bin/156.0.8078.48/chrome.dll
                python3 tests/host/check-process-winstation-init.py
                xcrun swiftc -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 -typecheck app/Madeira/WindowsBrowser.swift
                bash scripts/build-bitrise.sh bootstrap
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            - is_compress: 'true'
            - zip_name: Madeira-Chrome-Windows-check
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

