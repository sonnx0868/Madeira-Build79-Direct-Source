    description: Set MADEIRA_NATIVE_DEPS_URL and MADEIRA_NATIVE_DEPS_SHA256 before running.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          title: Restore native bundle, check app and build IPA
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                MADEIRA_NATIVE_RUNTIME_REFRESH=1 bash scripts/build-bitrise.sh cached
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            # Sideload IPAs have no mobileprovision. Export a generic ZIP instead
            # of asking Bitrise's installable-IPA parser to inspect the package.
            - is_compress: 'true'
            - zip_name: Madeira-v0.1.6-artifacts
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

