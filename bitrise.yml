format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

# Manual builds while comparing queue times with Codemagic.
# Match the Xcode 27 stack offered by this workspace's trial.
meta:
  bitrise.io:
    stack: osx-xcode-27.0.x
    machine_type_id: g2.mac.large

app:
  envs:
    - XCODE_PROJECT: app/Madeira.xcodeproj
    - XCODE_SCHEME: Madeira
    - APP_CONFIGURATION: Debug
    - JOBS: '4'
    - MADEIRA_NATIVE_DEPS_URL: https://github.com/sonnx0868/Madeira-Build79-Direct-Source/releases/download/v0.1.6-build794-9e615ce/Madeira-v0.1.6-native-deps-build794.zip
    - MADEIRA_NATIVE_DEPS_SHA256: a23c5e83bc82d22cce4d4d7cc30829c834ce79c1023be46255aa77ff81e1cd7f

workflows:
  madeira-session-priority-check:
    title: Validate foreground session priority and background restoration
    steps:
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                python3 tests/host/check-session-priority.py --require-darwin
                python3 tests/host/check-game-process.py --require-objc
                python3 tests/host/check-frontend.py --c-only
      - deploy-to-bitrise-io@2:
          inputs:
            - is_compress: 'true'
            - zip_name: Madeira-session-priority-check
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

  madeira-frame-scheduler-check:
    title: Validate Metal frame deadlines and drawable ownership on Apple Silicon
    steps:
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                python3 tests/host/check-metal-frame-scheduler.py --require-darwin
                python3 tests/host/check-capped-frame-intent.py
                python3 tests/host/check-metal-layer-configuration.py --require-darwin

  madeira-update-download-check:
    title: Check the IPA downloader with local failures and a real GitHub asset
    steps:
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                python3 tests/host/check-app-update-download.py --require-swift --live-asset

  madeira-nutssync-check:
    title: Validate production NutsSync semantics and contention on Apple Silicon
    steps:
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                bash scripts/check-nutssync.sh
                git submodule update --init --depth 1 wine
                bash scripts/apply-wine-patches.sh
                python3 tests/host/check-inproc-cache-retire.py
                python3 tests/host/check-runtime-scheduling-loader.py --require-darwin --yield-matrix
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            - is_compress: 'true'
            - zip_name: Madeira-NutsSync-check
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

  madeira-shader-optimizer-check:
    title: Compare saved shader loop optimizations on Metal
    description: Compile captured compute shaders through LLVM15 and Metal without producing an IPA.
    steps:
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          title: Check saved shaders with the shipping LLVM and Apple compiler
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                bash scripts/check-shader-loop-optimizer.sh
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            - is_compress: 'true'
            - zip_name: Madeira-shader-optimizer-check
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

  madeira-srv-vector-check:
    title: Validate bounded shader vector reads on Metal
    steps:
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          title: Compile production AIR and compare GPU output and cost
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                bash scripts/check-srv-vector-load.sh
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            - is_compress: 'true'
            - zip_name: Madeira-SRV-vector-check
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

  madeira-gpu-stage-check:
    title: Check original-device GPU stage sampling
    description: Compile public Metal stage hooks and exercise lifecycle/export gates without producing an IPA.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          title: Validate stage counters with Apple SDK and lifecycle tests
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                mkdir -p "$BITRISE_DEPLOY_DIR"
                exec > >(tee "$BITRISE_DEPLOY_DIR/gpu-stage-check.log") 2>&1
                git submodule update --init dxmt
                xcodebuild -version
                sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
                xcrun --sdk iphoneos clang -fobjc-arc -fmodules -fblocks -target arm64-apple-ios18.0 \
                  -isysroot "$sdk" -fsyntax-only app/Madeira/GPUTraceCapture.m
                python3 tests/host/check-gpu-stages.py --require-darwin
                python3 tests/host/check-gpu-trace.py --require-darwin
                python3 tests/host/check-gpu-trace-share.py
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            - is_compress: 'true'
            - zip_name: Madeira-GPU-stage-check
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

  madeira-gpu-analysis:
    title: Inspect Apple GPU capture analysis tools
    description: Locate GPU debugger and replayer tools on the Mac analysis runner, without producing an IPA.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          inputs:
            - clone_depth: '-1'
            - update_submodules: 'no'
      - script@1:
          title: Inspect GPU analysis toolchain
          inputs:
            - content: |-
                #!/bin/bash
                set -euo pipefail
                cd "$BITRISE_SOURCE_DIR"
                bash scripts/analyze-gpu-captures.sh
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            - is_compress: 'true'
            - zip_name: Madeira-GPU-analysis
            - is_enable_public_page: 'false'
            - notify_user_groups: none
            - always_notify_user_groups: none
            - notify_email_list: ''

  madeira-v016-signal-refresh:
