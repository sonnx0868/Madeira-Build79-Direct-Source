workflows:
  madeira-v014-bootstrap:
    name: Madeira v0.1.4 source bootstrap + IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: app/Madeira.xcodeproj
        XCODE_SCHEME: Madeira
        APP_CONFIGURATION: Debug
        DERIVED_DATA: /tmp/madeira-derived
    cache:
      cache_paths:
        - $CM_BUILD_DIR/FEX/build-ios
        - $CM_BUILD_DIR/wine/build-macos
        - $CM_BUILD_DIR/wine/build-arm64ec
        - $CM_BUILD_DIR/toolchains
        - $CM_BUILD_DIR/build/gnutls-ios/obj
        - $CM_BUILD_DIR/build/ffmpeg/obj
        - $CM_BUILD_DIR/build/freetype-ios/build
        - $CM_BUILD_DIR/build/wineserver/obj
        - $CM_BUILD_DIR/build/ntdll-unix/obj
        - $CM_BUILD_DIR/build/win32u-unix/obj
        - $CM_BUILD_DIR/build/dxmt-ios/obj
        - $CM_BUILD_DIR/build/rppairing-ios/target
        - $CM_BUILD_DIR/research/freetype
        - $CM_BUILD_DIR/app/Madeira/x86_64-vcruntime
    scripts:
      - name: Build Madeira v0.1.4 native dependencies
        script: bash scripts/bootstrap-native-deps.sh
      - name: Package reusable native bundle
        script: bash scripts/package-native-deps.sh "$CM_BUILD_DIR/madeira-v0.1.4-native-deps.zip"
      - name: Build unsigned Debug app
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/tests/host/check-remote-support.py" --require-swift
          python3 "$CM_BUILD_DIR/tests/host/check-frontend.py"
          python3 "$CM_BUILD_DIR/tests/host/check-game-pointer.py" --require-swift
          python3 "$CM_BUILD_DIR/tests/host/check-runtime-profilers.py"
          python3 "$CM_BUILD_DIR/tests/host/check-multi-game.py" --require-tools --require-swift
          bash "$CM_BUILD_DIR/scripts/prepare-release.sh" Madeira-v0.1.4-source-bootstrap.ipa
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration "$APP_CONFIGURATION" -sdk iphoneos -derivedDataPath "$DERIVED_DATA" \
            CURRENT_PROJECT_VERSION="$(cat "$CM_BUILD_DIR/build/release-info/build-number.txt")" \
            ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO build
      - name: Package ad-hoc IPA
        script: |
          set -euo pipefail
          app="$DERIVED_DATA/Build/Products/$APP_CONFIGURATION-iphoneos/Madeira.app"
          test -d "$app"
          test -d "$app/Frameworks/StikJIT.framework"
          test -d "$app/PlugIns/MadeiraJITHelper.appex"
          codesign --force --sign - --timestamp=none "$app/Frameworks/StikJIT.framework"
          codesign --force --sign - --timestamp=none "$app/PlugIns/MadeiraJITHelper.appex"
          codesign --force --sign - --entitlements "$CM_BUILD_DIR/app/Madeira/Madeira.entitlements" "$app"
          codesign --verify --deep --strict "$app"
          out="$CM_BUILD_DIR/build/v0.1.4-bootstrap"
          rm -rf "$out"; mkdir -p "$out/Payload"
          ditto "$app" "$out/Payload/Madeira.app"
          (cd "$out" && /usr/bin/zip -qry Madeira-v0.1.4-source-bootstrap.ipa Payload)
      - name: Publish GitHub test release when configured
        script: bash scripts/publish-release.sh "$CM_BUILD_DIR/build/v0.1.4-bootstrap/Madeira-v0.1.4-source-bootstrap.ipa"
    artifacts:
      - build/v0.1.4-bootstrap/Madeira-v0.1.4-source-bootstrap.ipa
      - madeira-v0.1.4-native-deps.zip
      - build/release-info/madeira-update.json
      - build/ntdll-unix/obj/*.err
      - build/win32u-unix/obj/*.err
      - build/wineserver/obj/*.txt
      - build/dxmt-ios/obj/*.err

  madeira-v014-ipa:
    name: Madeira v0.1.4 IPA from cached native bundle
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - madeira_build_inputs
      vars:
        XCODE_PROJECT: app/Madeira.xcodeproj
        XCODE_SCHEME: Madeira
        APP_CONFIGURATION: Debug
        DERIVED_DATA: /tmp/madeira-derived
    scripts:
      - name: Initialize upstream submodules
        script: |
          git submodule update --init FEX wine dxmt madeira-dock
          bash scripts/apply-wine-patches.sh
      - name: Restore native bundle
        script: bash scripts/restore-native-deps.sh
      - name: Build unsigned Debug app
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/tests/host/check-remote-support.py" --require-swift
          python3 "$CM_BUILD_DIR/tests/host/check-frontend.py"
          python3 "$CM_BUILD_DIR/tests/host/check-game-pointer.py" --require-swift
          python3 "$CM_BUILD_DIR/tests/host/check-runtime-profilers.py"
          python3 "$CM_BUILD_DIR/tests/host/check-multi-game.py" --require-tools --require-swift
          bash "$CM_BUILD_DIR/scripts/prepare-release.sh" Madeira-v0.1.4-source.ipa
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration "$APP_CONFIGURATION" -sdk iphoneos -derivedDataPath "$DERIVED_DATA" \
            CURRENT_PROJECT_VERSION="$(cat "$CM_BUILD_DIR/build/release-info/build-number.txt")" \
            ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO build
      - name: Package ad-hoc IPA
        script: |
          set -euo pipefail
          app="$DERIVED_DATA/Build/Products/$APP_CONFIGURATION-iphoneos/Madeira.app"
          test -d "$app"
          test -d "$app/Frameworks/StikJIT.framework"
          test -d "$app/PlugIns/MadeiraJITHelper.appex"
          codesign --force --sign - --timestamp=none "$app/Frameworks/StikJIT.framework"
          codesign --force --sign - --timestamp=none "$app/PlugIns/MadeiraJITHelper.appex"
          codesign --force --sign - --entitlements "$CM_BUILD_DIR/app/Madeira/Madeira.entitlements" "$app"
          codesign --verify --deep --strict "$app"
          out="$CM_BUILD_DIR/build/v0.1.4"
          rm -rf "$out"; mkdir -p "$out/Payload"
          ditto "$app" "$out/Payload/Madeira.app"
          (cd "$out" && /usr/bin/zip -qry Madeira-v0.1.4-source.ipa Payload)
      - name: Publish GitHub test release when configured
        script: bash scripts/publish-release.sh "$CM_BUILD_DIR/build/v0.1.4/Madeira-v0.1.4-source.ipa"
    artifacts:
      - build/v0.1.4/Madeira-v0.1.4-source.ipa
      - build/release-info/madeira-update.json
      - /tmp/xcodebuild_logs/*.log
